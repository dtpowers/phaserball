<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Earkandi Pinball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; touch-action: none; }
    #game-wrapper {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(4px, 1vh, 16px);
      gap: clamp(4px, 1vh, 12px);
    }
    #game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 700px;
      padding: clamp(4px, 1vw, 12px) clamp(8px, 2vw, 24px);
      font-family: Arial, sans-serif;
      color: #ffffff;
      gap: clamp(8px, 2vw, 24px);
      box-sizing: border-box;
    }
    #score-display {
      font-size: clamp(16px, 4vw, 32px);
      font-weight: bold;
      font-family: 'Fredoka One', Arial, sans-serif;
      text-shadow: 2px 2px 4px #000;
      color: #ffffff;
    }
    #lives-display {
      font-size: clamp(12px, 2.5vw, 18px);
      color: #ff6b9d;
      text-shadow: 1px 1px 3px #000;
    }
    #high-score {
      font-size: clamp(10px, 2vw, 16px);
      font-family: 'Fredoka One', Arial, sans-serif;
      color: #0ff0fc;
      text-shadow: 1px 1px 3px #000;
    }

    /* Font import for Phaser text fallback */
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

    /* HUD label — rainbow wave animation */
    .hud-label {
      font-family: 'Fredoka One', Arial, sans-serif;
      font-weight: bold;
      display: inline-block;
      animation: rainbow-wave 3s ease-in-out infinite;
    }

    /* Rainbow color cycle through game palette */
    @keyframes rainbow-wave {
      0%, 100% {
        color: #ff6b6b;
        transform: rotate(-1.5deg) scale(1);
      }
      16% {
        color: #ffe066;
        transform: rotate(1.5deg) scale(1.02);
      }
      33% {
        color: #57fb88;
        transform: rotate(-1.5deg) scale(1);
      }
      50% {
        color: #00f5ff;
        transform: rotate(1.5deg) scale(1.02);
      }
      66% {
        color: #c77dff;
        transform: rotate(-1.5deg) scale(1);
      }
      83% {
        color: #ff6bd6;
        transform: rotate(1.5deg) scale(1.02);
      }
    }

    /* Score value — base style + pop animation */
    #score-value, #hi-value {
      font-family: 'Fredoka One', Arial, sans-serif;
      display: inline-block;
      transition: transform 0.05s ease-out;
    }

    /* Score pop — triggered via JS class toggle */
    .score-pop {
      animation: score-pop-anim 0.15s ease-out;
    }

    @keyframes score-pop-anim {
      0% { transform: scale(1) translateX(0); }
      25% { transform: scale(1.15) translateX(-2px); }
      50% { transform: scale(1.1) translateX(2px); }
      75% { transform: scale(1.05) translateX(-1px); }
      100% { transform: scale(1) translateX(0); }
    }
    #game-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-header">
      <span id="high-score">
        <span class="hud-label">HI SCORE:</span>
        <span id="hi-value">0</span>
      </span>
      <span id="score-display">
        <span class="hud-label">SCORE:</span>
        <span id="score-value">0</span>
      </span>
      <span id="lives-display">&#9675;&#9675;&#9675;</span>
    </div>
    <div id="game-container"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
