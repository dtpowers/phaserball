<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Earkandi Pinball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; touch-action: none; }
    #game-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    #game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: fit-content;
      margin: 0 auto;
      padding: 8px 16px;
      font-family: Arial, sans-serif;
      color: #ffffff;
    }
    #score-display {
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }
    #lives-display {
      font-size: 18px;
      color: #ff6b9d;
      text-shadow: 1px 1px 3px #000;
    }
    #high-score {
      font-size: 16px;
      color: #0ff0fc;
      text-shadow: 1px 1px 3px #000;
    }
  </style>
</head>
<body>
  <div id="game-header">
    <span id="high-score">HI: 0</span>
    <span id="score-display">0</span>
    <span id="lives-display">Hearts: 3</span>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
