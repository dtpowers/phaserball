<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Earkandi Pinball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; touch-action: none; }
    #game-wrapper {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(4px, 1vh, 16px);
      gap: clamp(4px, 1vh, 12px);
    }
    #game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 700px;
      padding: clamp(4px, 1vw, 12px) clamp(8px, 2vw, 24px);
      font-family: Arial, sans-serif;
      color: #ffffff;
      gap: clamp(8px, 2vw, 24px);
      box-sizing: border-box;
    }
    #score-display {
      font-size: clamp(16px, 4vw, 32px);
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }
    #lives-display {
      font-size: clamp(12px, 2.5vw, 18px);
      color: #ff6b9d;
      text-shadow: 1px 1px 3px #000;
    }
    #high-score {
      font-size: clamp(10px, 2vw, 16px);
      color: #0ff0fc;
      text-shadow: 1px 1px 3px #000;
    }
    #game-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-header">
      <span id="high-score">HI: 0</span>
      <span id="score-display">0</span>
      <span id="lives-display">Hearts: 3</span>
    </div>
    <div id="game-container"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
